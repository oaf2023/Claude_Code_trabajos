name: CI — SafeAlert

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Typecheck & Lint & Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: safealert

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: safealert/package-lock.json

      - run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: npm audit
        run: npm audit --audit-level=high
        continue-on-error: true

  security:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for hardcoded secrets
        uses: zricethezav/gitleaks-action@v2
        continue-on-error: true

  backend-lint:
    name: Backend lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: python -m py_compile python/flask_app.py
